name: SiteGuide public delivery (TEST JSON + CORS)

on:
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - 'siteguide-runtime.js'
      - 'scripts/check-pages.mjs'
      - '.github/workflows/siteguide-public-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteguide-public-delivery
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare live Pages to public source (read-only)
        run: node scripts/check-pages.mjs
